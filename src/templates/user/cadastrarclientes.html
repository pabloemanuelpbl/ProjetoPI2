<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user/cadastrarclientes.css')}}" />
    <script>
        const API_GATEWAY = "{{ api_gateway }}";

        document.getElementById("myform").onsubmit = function(event) {
            event.preventDefault(); // Impede o envio padrão do formulário
            validarFormulario(event); // Chama a função de validação
        };

        // Validação simples no frontend
        function validarFormulario(event) {
            var senha = document.getElementById('senha').value;
            var confirmarSenha = document.getElementById('confirmar_senha').value;
            
            if (senha !== confirmarSenha) {
                alert("As senhas não coincidem!");
            }

            fetch(API_GATEWAY + "/users", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: document.getElementById('nome').value,
                    email: document.getElementById('email').value,
                    hashed_password: senha
                })
            }).then(response => {
                if (!response.ok) {
                    throw new Error('Erro na requisição: ' + response.statusText);
                }
                return response.json();
            }).then(response => {
                if (response.status === "success") {
                    alert("Usuário cadastrado com sucesso!");
                } else {
                    alert("Erro ao cadastrar usuário: " + response.message);
                }
            }).catch(error => {
                console.error('Erro:', error);
                alert("Erro ao cadastrar usuário. Tente novamente mais tarde.");
            });
        }
    </script>
</head>
<body>
    <main>
        <header>
            <h1>Cadastro de Usuário</h1>
        </header>
        <form id="myform">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>

            <label for="confirmar_senha">Confirmar Senha:</label>
            <input type="password" id="confirmar_senha" name="confirmar_senha" required>

            <div class="buttoncontainer">
                <button type="submit">Cadastrar</button>
                <button onclick="history.back()">Cancelar</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2024 Plataforma de Reciclagem</p>
    </footer>
</body>
</html>
